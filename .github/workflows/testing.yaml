---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Self-test: run this repository's composite action against its own
# source tree. Uses the local action via '$/'. Pull requests scan the
# changed files against the base branch; pushes and manual runs scan
# the full repository. A second job runs the unit tests, including the
# golden comparison of the SARIF converter against the pinned aislop.
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  self-scan:
    name: "Self scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The self-test does not upload SARIF (see the scan step below),
      # so it needs only read access to the repository contents.
      contents: read
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so changes mode can resolve the merge base of
          # the pull request branch against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: "Run aislop scan"
        id: "scan"
        uses: $/
        with:
          # yamllint disable-line rule:line-length
          scan-mode: ${{ github.event_name == 'pull_request' && 'changes' || 'full' }}
          # yamllint disable-line rule:line-length
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The scheduled org-wide publisher (lfreleng-actions/.github)
          # is the single source of code-scanning SARIF for every
          # repository, including this one. This self-test only
          # verifies the action runs end to end, so it must not upload
          # a second, competing analysis lineage to code scanning.
          upload-sarif: "false"

      - name: "Verify action outputs"
        shell: "bash"
        env:
          REPORT: ${{ steps.scan.outputs.report-file }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          SCORE: ${{ steps.scan.outputs.score }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          ENGINES_READY: ${{ steps.scan.outputs.engines-ready }}
          COVERAGE_DEGRADED: ${{ steps.scan.outputs.coverage-degraded }}
          ADVISORY_FINDINGS: ${{ steps.scan.outputs.advisory-findings }}
        run: |
          # Verify action outputs
          set -euo pipefail
          test -s "${REPORT}"
          test -s "${SARIF}"
          echo "report: ${REPORT}"
          echo "sarif: ${SARIF}"
          echo "score: ${SCORE:-<not scoreable>}"
          echo "gate exit code: ${EXIT_CODE}"
          echo "engines ready: ${ENGINES_READY}"
          echo "coverage degraded: ${COVERAGE_DEGRADED}"
          echo "advisory findings: ${ADVISORY_FINDINGS}"
          # Guard the regression this action was built around: without
          # the engine binaries aislop silently skips its Python and Go
          # engines and still returns a score. Assert on provisioning
          # rather than on the report's per-engine skip flags, which
          # also read "skipped" when the scan scope simply holds no
          # files of that language (routine in changes mode).
          if [ "${ENGINES_READY}" != 'true' ]; then
            echo 'error: engine binaries were not provisioned' >&2
            exit 1
          fi
          # The coverage outputs must always be set and well formed;
          # whether coverage was actually degraded depends on the npm
          # registry answering the dependency audit in time, which is
          # not this repository's to assert on.
          case "${COVERAGE_DEGRADED}" in
            true|false) ;;
            *)
              echo "error: coverage-degraded is '${COVERAGE_DEGRADED}';" \
                   "expected 'true' or 'false'" >&2
              exit 1
              ;;
          esac
          if ! [[ "${ADVISORY_FINDINGS}" =~ ^[0-9]+$ ]]; then
            echo "error: advisory-findings is '${ADVISORY_FINDINGS}';" \
                 'expected a non-negative integer' >&2
            exit 1
          fi
          # The two outputs must agree: with the engines provisioned
          # (asserted above) coverage is degraded exactly when aislop
          # reported an advisory diagnostic.
          if [ "${ADVISORY_FINDINGS}" = '0' ] \
             && [ "${COVERAGE_DEGRADED}" != 'false' ]; then
            echo 'error: coverage-degraded is true with no advisory' \
                 'findings' >&2
            exit 1
          fi
          if [ "${ADVISORY_FINDINGS}" != '0' ] \
             && [ "${COVERAGE_DEGRADED}" != 'true' ]; then
            echo 'error: coverage-degraded is false despite advisory' \
                 'findings' >&2
            exit 1
          fi
          # The SARIF is derived from the report, so it must be a
          # SARIF 2.1.0 log of one run holding one result per
          # diagnostic.
          if ! jq -e '.version == "2.1.0" and (.runs | length) == 1
                      and (.runs[0].tool.driver.name == "aislop")
                      and (.runs[0].results | type) == "array"' \
               "${SARIF}" > /dev/null; then
            echo 'error: sarif-file is not a SARIF 2.1.0 aislop log' >&2
            exit 1
          fi
          results="$(jq '.runs[0].results | length' "${SARIF}")"
          diagnostics="$(jq '.diagnostics | length' "${REPORT}")"
          if [ "${results}" != "${diagnostics}" ]; then
            echo "error: sarif-file holds ${results} results;" \
                 "the report holds ${diagnostics} diagnostics" >&2
            exit 1
          fi

  sarif-golden:
    name: "SARIF converter tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@bd83615a22b57835798adcb9ce753161464dfb40  # v0.16.2
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Install aislop exactly as action.yaml does: npm ci against the
      # bundled lock file, then the engine binaries. The golden test
      # compares against this pinned version, so a Dependabot bump that
      # changes aislop's SARIF fails here.
      - name: "Install pinned aislop"
        shell: "bash"
        run: |
          # Install pinned aislop
          set -euo pipefail
          work="${RUNNER_TEMP}/aislop"
          mkdir -p "${work}"
          cp package.json package-lock.json "${work}/"
          (cd "${work}" && npm ci --no-audit --no-fund --loglevel=error)
          # aislop-tools also fails on the optional .NET analyzers; the
          # check below and the fixture-coverage test judge the result.
          (cd "${work}" && node_modules/.bin/aislop-tools) || true
          test -x "${work}/node_modules/aislop/tools/bin/ruff"
          echo "AISLOP_BIN=${work}/node_modules/.bin/aislop" \
            >> "$GITHUB_ENV"

      - name: "Run tests"
        shell: "bash"
        env:
          AISLOP_NO_TELEMETRY: "1"
          AISLOP_NO_HISTORY: "1"
        run: |
          # Run tests
          set -euo pipefail
          pipx install 'uv==0.13.7'
          uv run --locked --python 3.12 --group dev pytest -v

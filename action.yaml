---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Composite action that runs the aislop AI-slop / code-quality scanner.
#
# The action reads its pinned aislop version from its own bundled
# package.json and installs it with `npm ci` against the bundled
# package-lock.json (both via ${{ github.action_path }}; the runner
# checks this action out at the pinned ref for the caller), so the
# integrity hashes in the lock file verify the npm download. It then
# provisions the engine binaries aislop shells out to, because 0.14.0
# dropped the package postinstall hook that used to fetch them and a
# scan without them silently under-reports. The scan writes a JSON
# report and a SARIF file, renders a step summary with the bundled
# parser, and publishes the SARIF to code scanning on request.
#
# The scan step never fails the job on findings: the exit-code output
# carries the aislop gate result so callers decide enforcement. The
# action fails when the tool itself breaks (no readable JSON report).
#
# The caller is responsible for checking out the repository under
# audit (with fetch-depth: 0 when scan-mode is "changes" and base
# names a branch) and for hardening the runner.

name: 'AI Slop Scan'
description: 'Scan code for AI slop and quality issues with the aislop CLI.'

inputs:
  scan-mode:
    description: >-
      Scan scope: "changes" audits files changed relative to base;
      "full" audits the whole working tree.
    required: false
    default: 'changes'
  base:
    description: >-
      Git ref that changes compare against in changes mode (for
      example origin/main). Empty compares against HEAD.
    required: false
    default: ''
  working-directory:
    description: 'Path within the workspace to scan.'
    required: false
    default: '.'
  aislop-version:
    description: >-
      Override the bundled pin with an explicit version (for example
      0.14.1). An override bypasses the bundled lock file and its
      integrity data.
    required: false
    default: ''
  extra-args:
    description: 'Additional raw arguments appended to the aislop call.'
    required: false
    default: ''
  annotate:
    description: >-
      Emit inline annotations for the top findings: 'true' or 'false'.
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload the SARIF to code scanning from within this action.'
    required: false
    default: 'false'
  require-engines:
    description: >-
      Fail when the required engine binaries (ruff, golangci-lint)
      cannot be provisioned: 'true' or 'false'. Without them aislop
      reports no Python or Go findings yet still returns a score, so
      the default fails rather than publish a silently partial scan.
      Set 'false' to accept reduced coverage with a warning.
    required: false
    default: 'true'
  summary-repository:
    description: >-
      owner/repo label for step-summary links; defaults to the
      repository running the workflow. Set when the workspace holds a
      checkout of a different repository. Applies only together with
      summary-sha: a partial or malformed pair is ignored with a
      warning.
    required: false
    default: ''
  summary-sha:
    description: >-
      Commit SHA (7-40 hex digits) for step-summary links; defaults
      to the workflow commit. Applies only together with
      summary-repository: a partial or malformed pair is ignored with
      a warning.
    required: false
    default: ''

outputs:
  sarif-file:
    description: 'Absolute path to the generated SARIF file.'
    value: ${{ steps.scan.outputs.sarif }}
  report-file:
    description: 'Absolute path to the generated JSON report.'
    value: ${{ steps.scan.outputs.report }}
  score:
    description: 'aislop score (0-100); empty when not scoreable.'
    value: ${{ steps.scan.outputs.score }}
  exit-code:
    description: >-
      Exit code of the aislop quality gate: '0' when the gate passes,
      non-zero when it holds findings below the configured threshold.
    value: ${{ steps.scan.outputs.exit-code }}
  engines-ready:
    description: >-
      'true' when both required engine binaries (ruff, golangci-lint)
      are present, 'false' when one is missing and require-engines
      allowed the scan to continue with reduced coverage. Does not
      cover the optional .NET analyzers.
    value: ${{ steps.engines.outputs.ready }}

runs:
  using: 'composite'
  steps:
    - name: 'Resolve aislop version'
      id: 'resolve'
      shell: 'bash'
      env:
        OVERRIDE: ${{ inputs.aislop-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "${OVERRIDE}" ]; then
          ver="${OVERRIDE#v}"
          locked='false'
          src='aislop-version input (bundled lock file bypassed)'
        else
          ver="$(jq -r '.dependencies.aislop' "${ACTION_PATH}/package.json")"
          locked='true'
          src='bundled package.json pin'
        fi
        if ! printf '%s' "${ver}" \
             | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
          echo "error: invalid aislop version '${ver}'" >&2
          exit 1
        fi
        {
          echo "version=${ver}"
          echo "locked=${locked}"
        } >> "$GITHUB_OUTPUT"
        echo "Using aislop ${ver} (from ${src})"

    - name: 'Install aislop'
      id: 'install'
      shell: 'bash'
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ steps.resolve.outputs.version }}
        LOCKED: ${{ steps.resolve.outputs.locked }}
      # The unlocked branch below deliberately installs a caller-specified
      # version outside the committed lockfile; the version is validated in
      # the resolve step, so this ad-hoc install is intentional.
      run: | # zizmor: ignore[adhoc-packages]
        set -euo pipefail
        # Install under a randomised temporary directory so node_modules
        # never lands in the audited workspace; the cleanup step removes
        # the whole directory. This installs the CLI only: the engine
        # binaries it shells out to arrive in the next step.
        work="$(mktemp -d "${RUNNER_TEMP}/aislop.XXXXXX")"
        echo "workdir=${work}" >> "$GITHUB_OUTPUT"
        if [ "${LOCKED}" = 'true' ]; then
          # npm ci verifies every download against the integrity
          # hashes committed in the bundled package-lock.json.
          cp "${ACTION_PATH}/package.json" \
             "${ACTION_PATH}/package-lock.json" "${work}/"
          (cd "${work}" && npm ci --no-audit --no-fund --loglevel=error)
        else
          (cd "${work}" && npm install --no-audit --no-fund \
            --loglevel=error "aislop@${VERSION}")
        fi
        bin="${work}/node_modules/.bin/aislop"
        if [ ! -x "${bin}" ]; then
          echo 'error: aislop binary not found after install' >&2
          exit 1
        fi
        echo "aislop=${bin}" >> "$GITHUB_OUTPUT"
        "${bin}" -V

    - name: 'Provision engine binaries'
      id: 'engines'
      shell: 'bash'
      env:
        AISLOP_NO_TELEMETRY: '1'
        WORKDIR: ${{ steps.install.outputs.workdir }}
        REQUIRE: ${{ inputs.require-engines }}
      run: |
        set -euo pipefail
        case "${REQUIRE}" in
          true|false) ;;
          *)
            echo "error: invalid require-engines '${REQUIRE}';" \
                 "expected 'true' or 'false'" >&2
            exit 1
            ;;
        esac
        # aislop delegates its Python engines to ruff and its Go engines
        # to golangci-lint. Releases before 0.14.0 fetched both from a
        # package postinstall hook; 0.14.0 dropped that hook and moved
        # the work into an explicit aislop-tools entry point, so a bare
        # `npm ci` now leaves both binaries absent. aislop then reports
        # zero findings for those languages while still emitting a
        # score, which reads as a clean repository rather than an
        # incomplete scan.
        tools="${WORKDIR}/node_modules/.bin/aislop-tools"
        if [ -x "${tools}" ]; then
          # aislop-tools exits non-zero when ANY bundled tool fails,
          # including the optional .NET analyzers it pulls from
          # api.nuget.org, even when ruff and golangci-lint installed
          # cleanly. Its exit code cannot separate a partial failure
          # from a total one, so record it and verify by outcome.
          rc=0
          (cd "${WORKDIR}" && "${tools}") || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "aislop-tools exit code: ${rc};" \
                 'verifying the required binaries by outcome'
          fi
        else
          # An aislop-version override can select a pre-0.14.0 release,
          # which provisions the binaries from its postinstall hook and
          # ships no aislop-tools entry point. Fall through to the same
          # outcome check rather than failing on the missing installer.
          echo 'aislop-tools absent; relying on the package postinstall'
        fi
        engine_bin="${WORKDIR}/node_modules/aislop/tools/bin"
        # A system installation counts: aislop resolves ruff and
        # golangci-lint from the PATH as well as from its bundled
        # copies, so a runner that preinstalls them has full coverage
        # even when the download failed.
        missing=''
        langs=''
        for tool in ruff golangci-lint; do
          case "${tool}" in
            ruff) lang='Python' ;;
            *) lang='Go' ;;
          esac
          if [ -x "${engine_bin}/${tool}" ]; then
            echo "engine binary ready: ${tool} (${lang}, bundled)"
          elif command -v "${tool}" > /dev/null 2>&1; then
            echo "engine binary ready: ${tool} (${lang}, system)"
          else
            missing="${missing:+${missing}, }${tool}"
            langs="${langs:+${langs} and }${lang}"
          fi
        done
        if [ -z "${missing}" ]; then
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo 'ready=false' >> "$GITHUB_OUTPUT"
        # Name only the languages the missing binaries actually cover:
        # a failed ruff download leaves the Go engines intact.
        note="aislop engine binaries missing: ${missing}. ${langs}"
        note="${note} findings will be under-reported and the score"
        note="${note} inflated. Allow egress to github.com and"
        note="${note} release-assets.githubusercontent.com, install the"
        note="${note} tools on the runner, or set require-engines:"
        note="${note} 'false' to accept the gap."
        if [ "${REQUIRE}" = 'false' ]; then
          echo "::warning::${note}"
        else
          echo "::error::${note}"
          exit 1
        fi

    - name: 'Run aislop scan (advisory)'
      id: 'scan'
      shell: 'bash'
      env:
        AISLOP_NO_TELEMETRY: '1'
        AISLOP_NO_HISTORY: '1'
        AISLOP_BIN: ${{ steps.install.outputs.aislop }}
        SCAN_MODE: ${{ inputs.scan-mode }}
        BASE: ${{ inputs.base }}
        WORKDIR: ${{ inputs.working-directory }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        case "${SCAN_MODE}" in
          changes|full) ;;
          *)
            echo "error: invalid scan-mode '${SCAN_MODE}';" \
                 "expected 'changes' or 'full'" >&2
            exit 1
            ;;
        esac
        args=(ci)
        scope='full repository'
        if [ "${SCAN_MODE}" = 'changes' ]; then
          args+=(--changes)
          scope='changed files vs HEAD'
          if [ -n "${BASE}" ]; then
            args+=(--base "${BASE}")
            scope="changed files vs ${BASE}"
          fi
        fi
        # Write outputs into a fresh directory outside the audited
        # workspace so the scan never leaves untracked files behind
        # in the caller's working tree.
        out="$(mktemp -d "${RUNNER_TEMP}/aislop-out.XXXXXX")"
        report="${out}/aislop-report.json"
        sarif="${out}/aislop.sarif"
        # aislop exits non-zero when its quality gate fails; capture the
        # exit code and leave pass/fail policy to the caller. The second
        # run reuses the installed CLI, so the SARIF costs only a rescan
        # of the same working tree.
        # Word-splitting of EXTRA_ARGS is intentional (passthrough).
        # shellcheck disable=SC2086
        rc=0
        (cd "${WORKDIR}" \
          && "${AISLOP_BIN}" "${args[@]}" ${EXTRA_ARGS} > "${report}") \
          || rc=$?
        # shellcheck disable=SC2086
        (cd "${WORKDIR}" \
          && "${AISLOP_BIN}" "${args[@]}" --sarif ${EXTRA_ARGS} \
          > "${sarif}") || true
        echo "aislop exit code: ${rc}"
        # Both outputs must be valid JSON; anything else means the tool
        # itself failed rather than reported findings.
        jq -e . "${report}" > /dev/null
        jq -e . "${sarif}" > /dev/null
        score="$(jq -r '.score // empty' "${report}")"
        {
          echo "report=${report}"
          echo "sarif=${sarif}"
          echo "score=${score}"
          echo "exit-code=${rc}"
          echo "scope=${scope}"
        } >> "$GITHUB_OUTPUT"

    - name: 'Render step summary'
      if: ${{ steps.scan.outcome == 'success' }}
      shell: 'bash'
      env:
        AISLOP_JSON: ${{ steps.scan.outputs.report }}
        AISLOP_SCOPE: ${{ steps.scan.outputs.scope }}
        AISLOP_ANNOTATE: ${{ inputs.annotate }}
        AISLOP_TOP_N: '10'
        AISLOP_REPOSITORY: ${{ inputs.summary-repository }}
        AISLOP_SHA: ${{ inputs.summary-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 "${ACTION_PATH}/.github/scripts/aislop_summary.py"

    - name: 'Upload SARIF to code scanning'
      if: >-
        ${{ inputs.upload-sarif == 'true'
        && steps.scan.outcome == 'success' }}
      # yamllint disable-line rule:line-length
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        # Category groups these results in code scanning.
        category: 'aislop'
      # A transient code-scanning API error must not fail an advisory
      # scan; the SARIF remains available as an output for retry.
      continue-on-error: true

    - name: 'Clean up temporary files'
      if: always()
      shell: 'bash'
      env:
        TMP_WORKDIR: ${{ steps.install.outputs.workdir }}
      run: |
        set -euo pipefail
        if [ -n "${TMP_WORKDIR:-}" ] && [ -d "${TMP_WORKDIR}" ]; then
          rm -rf "${TMP_WORKDIR}"
        fi
